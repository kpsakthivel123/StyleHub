<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleHub - Secure Checkout</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">Style<span>Hub</span></div>
  <nav><a href="cart.html">← Cart</a></nav>
</header>
<main class="page">
<h1>Secure Checkout 🔒</h1>
<form id="checkoutForm" class="checkout">
  <label>Full Name<input required type="text" placeholder="Your name"></label>
  <label>Email<input required type="email" placeholder="you@example.com"></label>
  <label>Address<textarea required placeholder="Delivery address"></textarea></label>
  <label>Payment Method
    <select required><option>Card</option><option>UPI</option><option>Cash on Delivery</option></select>
  </label>
  <button class="btn" type="submit">Place Order</button>
</form>
<p id="orderMsg"></p>
</main>
<script src="script.js"></script>
</body>
</html>
